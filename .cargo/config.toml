[alias]
check-all = "check --all-targets --all-features"
check-min = "check --no-default-features"
test-full = "test --all-features"
test-lib-all = "test --lib --all-features"
test-matrix = "test --features widgets widget_state_matrix_core_controls_keep_geometry_and_pointer_targets"
test-native = "test --features native-window runtime::native::tests"
test-perf = "test --features widgets,wgpu,test-support --test perf_smoke -- --nocapture"
test-wgpu-snap = "test --features wgpu,test-support --test wgpu_snapshot_parity -- --nocapture --test-threads=1"
