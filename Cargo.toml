[package]
name = "operad"
version = "5.0.0"
edition = "2021"
license = "MIT"
description = "Renderer-neutral UI toolkit contracts and rendering primitives."
repository = "https://github.com/Andrewp2/Operad"

[lib]
name = "operad"
path = "src/lib.rs"

[features]
default = []
accesskit-winit = ["dep:accesskit", "dep:accesskit_winit", "dep:winit"]
egui = ["dep:egui"]
egui-renderer-compat = ["egui"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:glyphon"]
native-window = ["wgpu", "dep:winit"]
text-cosmic = ["dep:cosmic-text"]
widgets = []
audit = []

[dependencies]
accesskit = { version = "0.21.1", optional = true }
accesskit_winit = { version = "0.29.2", optional = true, default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
cosmic-text = { version = "0.14.2", optional = true }
egui = { version = "0.33.3", optional = true }
glyphon = { version = "0.9.0", optional = true }
lyon_tessellation = "1.0.20"
pollster = { version = "0.4.0", optional = true }
taffy = "0.10.1"
wgpu = { version = "25.0.1", optional = true, features = ["wgsl"] }
winit = { version = "0.30.12", optional = true }
