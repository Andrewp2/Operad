name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install headless graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xdotool

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check no default features
        run: cargo check --locked --no-default-features --all-targets

      - name: Test no default features
        run: cargo test --locked --no-default-features

      - name: Check all features
        run: cargo check --locked --all-features --all-targets

      - name: Test all-feature library and rendering contracts
        run: cargo test --locked --all-features --lib --test api_surface --test runtime_integration --test wgpu_snapshot_parity

      - name: Just Work showcase regressions
        run: cargo test --locked --all-features --test showcase_layout -- showcase_ --test-threads=1

      - name: Just Work performance smoke
        run: cargo test --locked --no-default-features --features widgets,test-support --test perf_smoke --test text_input_allocations -- --test-threads=1

      - name: Check examples
        run: cargo check --locked --all-features --examples

      - name: Native clipboard ownership regression
        run: |
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET OPERAD_CLIPBOARD_TEST_DISPLAY=1 xvfb-run -a cargo test --locked --all-features --lib native_clipboard_retains_text_between_requests -- --ignored --test-threads=1

      - name: Native background completion regressions
        run: |
          cargo build --locked --all-features --example runtime_task
          xvfb-run -a python3 scripts/check-native-task.py

      - name: Native device-loss regression
        run: |
          cargo build --locked --all-features --example native_device_loss
          xvfb-run -a python3 scripts/check-native-device-loss.py

      - name: Native showcase pointer regressions
        run: |
          cargo build --locked --all-features --example native_pointer
          python3 scripts/check-native-pointer.py

      - name: Build docs
        run: cargo doc --locked --all-features --no-deps

      - name: Package dry run
        run: cargo package --locked

  showcase-pages:
    name: Showcase Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test browser runner transport and cleanup
        run: node --test scripts/*.test.mjs

      - name: Install headless browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Build showcase WASM
        run: >
          cargo build --locked --release
          --target wasm32-unknown-unknown
          --no-default-features
          --features web-showcase
          --example showcase_web

      - name: Check minimal web template
        run: >
          cargo check --locked
          --target wasm32-unknown-unknown
          --no-default-features
          --features web-runtime
          --example minimal_web

      - name: Package browser runtime
        run: >
          cargo package --locked
          --target wasm32-unknown-unknown
          --no-default-features
          --features web-runtime

      - name: Assemble Pages artifact
        run: |
          rm -rf dist
          mkdir -p dist/pkg dist/showcase/pkg
          cp web/showcase/index.html dist/index.html
          cp web/showcase/index.html dist/showcase/index.html
          cp web/showcase/favicon.png dist/favicon.png
          cp web/showcase/favicon.png dist/showcase/favicon.png
          touch dist/.nojekyll
          wasm-bindgen \
            --target web \
            --out-dir dist/pkg \
            --out-name showcase_web \
            target/wasm32-unknown-unknown/release/examples/showcase_web.wasm
          cp -R dist/pkg/. dist/showcase/pkg/

      - name: Verify Pages artifact routes
        run: |
          test -f dist/index.html
          test -f dist/favicon.png
          test -f dist/pkg/showcase_web.js
          test -f dist/showcase/index.html
          test -f dist/showcase/favicon.png
          test -f dist/showcase/pkg/showcase_web.js

      - name: Browser smoke test web showcase
        run: |
          python3 -m http.server 8787 --directory dist > "${RUNNER_TEMP}/operad-pages.log" 2>&1 &
          server=$!
          trap 'kill "${server}" 2> /dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" -eq 1
          OPERAD_WEB_SHOWCASE_UAT=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8787/
          OPERAD_WEB_SHOWCASE_UAT=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8787/showcase/

      - name: Browser runtime scheduling and failure regressions
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown \
            --no-default-features --features web-showcase --example runtime_scheduling
          probe_dir=$(mktemp -d)
          wasm-bindgen --target web --out-dir "$probe_dir/pkg" --out-name runtime_scheduling \
            target/wasm32-unknown-unknown/release/examples/runtime_scheduling.wasm
          cp tests/fixtures/runtime_scheduling.html "$probe_dir/index.html"
          python3 -m http.server 8788 --bind 127.0.0.1 --directory "$probe_dir" > "${RUNNER_TEMP}/operad-scheduling.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true; rm -rf "$probe_dir"' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          OPERAD_WEB_SCHEDULING_PROBE=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8788/
          OPERAD_WEB_CLOCK_PROBE=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8788/
          OPERAD_WEB_DEVICE_LOSS_PROBE=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8788/
          OPERAD_WEB_RENDER_FAILURE_PROBE=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8788/

      - name: Browser editor integration regressions
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown \
            --no-default-features --features web-showcase --example runtime_editor
          probe_dir=$(mktemp -d)
          wasm-bindgen --target web --out-dir "$probe_dir/pkg" --out-name runtime_editor \
            target/wasm32-unknown-unknown/release/examples/runtime_editor.wasm
          cp tests/fixtures/runtime_editor.html "$probe_dir/index.html"
          python3 -m http.server 8789 --bind 127.0.0.1 --directory "$probe_dir" > "${RUNNER_TEMP}/operad-editor.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true; rm -rf "$probe_dir"' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8789/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          OPERAD_WEB_EDITOR_PROBE=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8789/

      - name: Browser text composition regressions
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown \
            --no-default-features --features web-runtime,widgets --example runtime_ime
          probe_dir=$(mktemp -d)
          wasm-bindgen --target web --out-dir "$probe_dir/pkg" --out-name runtime_ime \
            target/wasm32-unknown-unknown/release/examples/runtime_ime.wasm
          cp tests/fixtures/runtime_ime.html "$probe_dir/index.html"
          python3 -m http.server 8790 --bind 127.0.0.1 --directory "$probe_dir" > "${RUNNER_TEMP}/operad-ime.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2> /dev/null || true; rm -rf "$probe_dir"' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" -eq 1
          OPERAD_WEB_IME_PROBE=1 xvfb-run -a node scripts/check-web-showcase.mjs http://127.0.0.1:8790/

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    name: Deploy Pages
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: showcase-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
